[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-usage-manager"
version = "0.2.6"
description = "Local htop-style dashboard and guarded kill switch for headless AI-agent processes."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["ai-agents", "monitoring", "gpu", "ollama", "vllm", "llm", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "psutil>=5.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/minglong51/agent-usage-manager"
Repository = "https://github.com/minglong51/agent-usage-manager"
Issues = "https://github.com/minglong51/agent-usage-manager/issues"
Documentation = "https://github.com/minglong51/agent-usage-manager/blob/main/docs/reference.md"
Changelog = "https://github.com/minglong51/agent-usage-manager/blob/main/CHANGELOG.md"
Security = "https://github.com/minglong51/agent-usage-manager/security/policy"

[project.scripts]
agent-usage-manager = "agent_usage_manager.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["agent_usage_manager"]
# agents.yaml is an operator-owned source-checkout config, not a shippable
# default; the wheel carries agents.default.yaml instead.
exclude = ["agent_usage_manager/agents.yaml"]

[tool.hatch.build.targets.sdist]
include = [
    "/agent_usage_manager",
    "/docs/reference.md",
    "/README.md",
    "/CHANGELOG.md",
    "/SECURITY.md",
    "/LICENSE",
    "/pyproject.toml",
]
exclude = ["agent_usage_manager/agents.yaml"]
