<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>agent usage manager</title>
<style>
  :root { color-scheme: dark; }
  body { font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
         margin: 0; background: #0d1117; color: #c9d1d9; }
  header { padding: 14px 20px; border-bottom: 1px solid #21262d;
           display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 16px; margin: 0; }
  .meta { color: #8b949e; font-size: 12px; }
  .cfg { color: #6e7681; font-size: 11px; flex-basis: 100%; }
  .cfg.err { color: #f85149; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
         margin-right: 6px; vertical-align: middle; }
  .live { background: #3fb950; } .dead { background: #f85149; }
  .wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #161b22;
           white-space: nowrap; }
  th { color: #8b949e; font-weight: 600; font-size: 12px; text-transform: uppercase;
       letter-spacing: .04em; }
  td.cmd { white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
           max-width: 380px; color: #8b949e; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .label { background: #1f6feb33; color: #79c0ff; padding: 1px 7px;
           border-radius: 10px; font-size: 12px; }
  .svc { background: #bb800933; color: #d29922; padding: 1px 7px; margin-left: 5px;
         border-radius: 10px; font-size: 11px; cursor: help; }
  .flag { padding: 1px 7px; margin-left: 5px; border-radius: 10px; font-size: 11px;
          cursor: help; }
  .flag.hot { background: #da363333; color: #f85149; }
  .flag.idle { background: #30363d66; color: #8b949e; }
  .flag.churn { background: #d2992233; color: #e3b341; }
  code.hint { font: 12px ui-monospace, Menlo, monospace; color: #adbac7;
              background: #161b22; border: 1px solid #21262d; border-radius: 6px;
              padding: 4px 8px; cursor: copy; white-space: nowrap; }
  code.hint:hover { border-color: #d29922; }
  .kids { color: #79c0ff; font-size: 11px; margin-left: 5px; cursor: pointer;
          border-bottom: 1px dotted #30363d; }
  .kids:hover { color: #a5d6ff; }
  .spark { display: block; margin-top: 3px; }
  .spark polyline { fill: none; stroke: #d29922; stroke-width: 1.2; }
  .spark line { stroke: #21262d; stroke-width: 1; }
  tr.child td { color: #8b949e; font-size: 12px; background: #0b0f14;
                border-bottom: 1px solid #11151b; padding-top: 4px; padding-bottom: 4px; }
  tr.child td.cmd { max-width: 380px; }
  button.kill { background: #da3633; color: #fff; border: 0; padding: 5px 12px;
                border-radius: 6px; cursor: pointer; font: inherit; }
  button.kill:hover { background: #f85149; }
  button.kill:disabled { background: #30363d; color: #6e7681; cursor: not-allowed; }
  /* force = SIGKILL, the more destructive action — render it secondary (ghost)
     so it isn't a same-weight one-click neighbour of plain kill. */
  button.kill.ghost { background: transparent; color: #8b949e; border: 1px solid #30363d;
                      padding: 4px 9px; font-size: 12px; }
  button.kill.ghost:hover { background: #da363322; color: #f85149; border-color: #da3633; }
  button.kill.ghost:disabled { background: transparent; color: #484f58; border-color: #21262d; }
  /* stale = last /api/agents fetch failed; dim the data we can no longer trust. */
  #stale { display: none; background: #3d1d00; color: #d29922; font-size: 12px;
           padding: 6px 20px; border-bottom: 1px solid #5a2d00; }
  body.stale #stale { display: block; }
  body.stale table { opacity: .45; transition: opacity .2s; }
  .empty { padding: 40px 20px; color: #8b949e; }
  .err { color: #f85149; }
  .ok { color: #3fb950; }
  body.hide-gpu .gpu { display: none; }   /* no GPU data (e.g. Apple Silicon) → drop the dead column */
  @media (max-width: 700px) {
    th, td { padding: 6px 8px; }
    .c-status, .c-up, .c-cmd, .c-pid { display: none; }  /* keep agent/cpu/mem/actions */
    header { padding: 10px 12px; gap: 10px; }
    #stale { padding: 6px 12px; }
    /* visually truncate the launchctl hint; click-to-copy still copies the full text */
    code.hint { display: inline-block; max-width: 110px; overflow: hidden;
                text-overflow: ellipsis; vertical-align: middle; }
  }
</style>
</head>
<body>
<header>
  <h1>agent usage manager</h1>
  <span class="meta" id="meta">loading…</span>
  <span class="meta" id="err"></span>
  <span class="cfg" id="cfg"></span>
</header>
<div id="stale"></div>
<div class="wrap">
<table id="tbl">
  <thead>
    <tr>
      <th>agent</th><th class="c-pid">pid</th><th class="c-status">status</th>
      <th class="num">cpu %</th><th class="num">mem MB</th>
      <th class="num gpu">gpu MB</th><th class="num c-up">uptime</th>
      <th class="c-cmd">command</th><th></th>
    </tr>
  </thead>
</table>
</div>
<div class="empty" id="empty" hidden>No matching agents running.</div>

<script>
const tbl = document.getElementById("tbl");
const meta = document.getElementById("meta");
const errEl = document.getElementById("err");
const cfgEl = document.getElementById("cfg");
const empty = document.getElementById("empty");
const stale = document.getElementById("stale");
let lastOk = null;          // timestamp of the last successful /api/agents fetch
const expanded = new Set(); // pids whose process subtree is unfolded
const bodies = new Map();   // pid -> its <tbody> (one tbody per agent: row + children)

// Reordering rows under the pointer relocates the kill button mid-aim — freeze
// the ORDER (not the data) while the pointer is over the table.
let overTable = false;
tbl.addEventListener("pointerenter", () => { overTable = true; });
tbl.addEventListener("pointerleave", () => { overTable = false; });

// Escape before injecting into innerHTML — cmdlines and launchd labels are
// host data, and this page has a kill endpoint, so HTML/script injection is a
// real local-control risk.
function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function dur(s) {
  s = Math.max(0, s|0);
  const d = Math.floor(s/86400), h = Math.floor(s%86400/3600),
        m = Math.floor(s%3600/60);
  if (d) return d+"d "+h+"h";
  if (h) return h+"h "+m+"m";
  if (m) return m+"m";
  return s+"s";
}

function spark(trend) {
  if (!trend || trend.length < 2) return "";
  const W = 64, H = 14, max = Math.max(100, ...trend);
  const pts = trend.map((c, i) =>
    `${(i / (trend.length - 1) * W).toFixed(1)},${(H - 1 - c / max * (H - 2)).toFixed(1)}`
  ).join(" ");
  const mins = Math.round(trend.length * 3 / 60);
  return `<svg class="spark" width="${W}" height="${H}" aria-hidden="true">
    <title>cpu, last ~${mins || 1} min</title>
    <line x1="0" y1="${H-1}" x2="${W}" y2="${H-1}"></line>
    <polyline points="${pts}"></polyline></svg>`;
}

async function kill(pid, force, children) {
  const verb = force ? "FORCE KILL (SIGKILL)" : "kill (SIGTERM)";
  const kids = children > 0
    ? ` and its ${children} child process${children > 1 ? "es" : ""}`
    : "";
  if (!confirm(verb + " PID " + pid + kids + "?")) return;
  try {
    const r = await fetch(`/api/kill/${pid}?force=${force}`, {method: "POST"});
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || r.status);
    errEl.className = "meta ok";
    errEl.textContent = `✓ ${j.result} (${j.killed} process${j.killed===1?"":"es"})`;
    setTimeout(() => { errEl.textContent = ""; errEl.className = "meta"; }, 4000);
    await refresh();
  } catch (e) { errEl.className = "meta err"; errEl.textContent = "kill failed: " + e.message; }
}

function copyHint(el) {
  navigator.clipboard?.writeText(el.textContent).then(() => {
    const prev = el.textContent;
    el.textContent = "copied ✓";
    setTimeout(() => { el.textContent = prev; }, 1000);
  });
}

function childRows(tree) {
  return tree.filter(c => c.depth > 0).map(c => `<tr class="child">
    <td style="padding-left:${12 + c.depth * 14}px">↳ ${esc(c.name)}</td>
    <td class="c-pid">${c.pid}</td><td class="c-status"></td>
    <td class="num">${c.cpu_percent.toFixed(1)}</td>
    <td class="num">${c.mem_mb.toFixed(0)}</td>
    <td class="num gpu"></td><td class="num c-up"></td>
    <td class="cmd c-cmd" title="${esc(c.cmdline)}">${esc(c.cmdline)}</td><td></td>
  </tr>`).join("");
}

async function toggleTree(pid) {
  if (expanded.has(pid)) { expanded.delete(pid); renderTree(pid, null); return; }
  expanded.add(pid);
  await loadTree(pid);
}

async function loadTree(pid) {
  try {
    const r = await fetch(`/api/tree/${pid}`);
    if (!r.ok) throw new Error("HTTP " + r.status);
    renderTree(pid, (await r.json()).tree);
  } catch (e) { expanded.delete(pid); }
}

function renderTree(pid, tree) {
  const tb = bodies.get(pid);
  if (!tb) return;
  tb.querySelectorAll("tr.child").forEach(tr => tr.remove());
  if (tree) tb.firstElementChild.insertAdjacentHTML("afterend", childRows(tree));
}

function rowHTML(x, cpus) {
  const protectedNote = x.protected ? ' title="protected — cannot be killed"' : "";
  const kids = x.child_count > 0
    ? ` <span class="kids" title="${x.child_count} child process(es) — CPU/mem/GPU are tree totals; kill stops the whole tree. Click to ${expanded.has(x.pid) ? "collapse" : "expand"}." onclick="toggleTree(${x.pid})">${expanded.has(x.pid) ? "−" : "+"}${x.child_count}</span>`
    : "";
  const svc = x.supervised
    ? ` <span class="svc" title="Supervised by launchd (job '${esc(x.supervised)}'). A signal won't stop it — launchd respawns it. Use the launchctl command on the right.">launchd</span>`
    : "";
  const flag = x.flag === "hot"
    ? ` <span class="flag hot" title="CPU pegged ≥90% of a core for 5+ minutes — runaway?">hot 5m+</span>`
    : x.flag === "idle"
      ? ` <span class="flag idle" title="No CPU activity for 10+ minutes — wedged, or just waiting?">idle 10m+</span>`
      : x.flag === "churn"
        ? ` <span class="flag churn" title="${x.restarts} short-lived restarts in the last 10 minutes — crash-looping under a supervisor?">churn ×${x.restarts}</span>`
        : "";
  // launchd-supervised jobs can't be stopped by a signal; show the real
  // command (click to copy) instead of dead-end kill buttons.
  const actions = x.supervised
    ? `<code class="hint" title="click to copy" onclick="copyHint(this)">${esc(x.stop_hint)}</code>`
    : `<button class="kill" ${x.protected?'disabled':''}${protectedNote}
        onclick="kill(${x.pid}, false, ${x.child_count})">kill</button>
      <button class="kill ghost" ${x.protected?'disabled':''}
        title="SIGKILL — forceful, no cleanup. Use only if plain kill won't stop it."
        onclick="kill(${x.pid}, true, ${x.child_count})">force</button>`;
  return `<tr>
    <td><span class="label">${esc(x.label)}</span>${svc}${flag}${kids}</td>
    <td class="c-pid">${x.pid}</td>
    <td class="c-status"><span class="dot ${x.alive?'live':'dead'}"></span>${esc(x.status)}</td>
    <td class="num" title="${x.cpu_percent.toFixed(0)}% of one core · ${(x.cpu_percent/cpus).toFixed(0)}% of all ${cpus} cores">${x.cpu_percent.toFixed(1)}${spark(x.trend)}</td>
    <td class="num">${x.mem_mb.toFixed(0)}</td>
    <td class="num gpu">${x.gpu_mem_mb==null?'—':x.gpu_mem_mb.toFixed(0)}</td>
    <td class="num c-up">${dur(x.uptime_s)}</td>
    <td class="cmd c-cmd" title="${esc(x.cmdline)}">${esc(x.cmdline)}</td>
    <td>${actions}</td>
  </tr>`;
}

async function refresh() {
  // Don't re-render mid-selection — it would yank a command/launchctl hint the
  // user is in the middle of copying.
  if (String(window.getSelection?.() || "").length) return;
  let data;
  try {
    const r = await fetch("/api/agents");
    if (!r.ok) throw new Error("HTTP " + r.status);
    data = await r.json();
    // recovered → clear the stale state and any prior fetch error
    document.body.classList.remove("stale");
    if (errEl.textContent.startsWith("fetch failed")) errEl.textContent = "";
  } catch (e) {
    // Don't blank the table — keep showing the last good data, but mark it
    // untrusted so nobody kills based on a frozen view.
    document.body.classList.add("stale");
    const last = lastOk ? " · last update " + lastOk.toLocaleTimeString() : "";
    stale.textContent = "⚠ disconnected from the agent monitor — data below may be stale" + last;
    errEl.className = "meta err";
    errEl.textContent = "fetch failed: " + e.message;
    return;
  }
  lastOk = new Date();

  const a = data.agents;
  const totCpu = a.reduce((s, x) => s + x.cpu_percent, 0);
  const totMem = a.reduce((s, x) => s + x.mem_mb, 0);
  const load = a.length
    ? ` · Σ ${totCpu.toFixed(0)}% cpu, ${(totMem/1024).toFixed(1)} GB`
    : "";
  const ram = data.mem_total_mb
    ? ` · ram ${(data.mem_total_mb * data.mem_used_pct / 100 / 1024).toFixed(0)}/${(data.mem_total_mb/1024).toFixed(0)} GB`
    : "";
  meta.textContent = `${data.host || "host"} · ${data.cpu_count} cpus${ram} · ${a.length} agents${load} · ${new Date(data.ts*1000).toLocaleTimeString()}`;
  document.title = a.length
    ? `${a.length} agent${a.length===1?"":"s"} · ${totCpu.toFixed(0)}% cpu`
    : "agent usage manager";
  cfgEl.className = data.config_error ? "cfg err" : "cfg";
  cfgEl.textContent = data.config_error
    ? `config error — running on last good config: ${data.config_error}`
    : `config: ${data.config_path} (edits hot-reload)`;
  empty.hidden = a.length > 0;
  if (!a.length) empty.textContent =
    `No matching agents running. Edit ${data.config_path} to add matchers — changes apply without a restart.`;
  // Drop the GPU column entirely when nothing reports GPU (Apple Silicon has no
  // per-process GPU API) — an always-"—" column reads as broken, not empty.
  document.body.classList.toggle("hide-gpu", !a.some(x => x.gpu_mem_mb != null));
  const cpus = data.cpu_count || 1;

  // Keyed update: one <tbody> per agent. Rewriting a row in place keeps its
  // geometry stable; tbodys are only MOVED (reordered) when the pointer is
  // away from the table, so a kill button never shifts under the cursor.
  a.sort((p, q) => p.label === q.label ? p.pid - q.pid : (p.label < q.label ? -1 : 1));
  const seen = new Set();
  for (const x of a) {
    seen.add(x.pid);
    let tb = bodies.get(x.pid);
    if (!tb) {
      tb = document.createElement("tbody");
      bodies.set(x.pid, tb);
      tbl.appendChild(tb);
    }
    tb.firstElementChild ? tb.firstElementChild.outerHTML = rowHTML(x, cpus)
                         : tb.innerHTML = rowHTML(x, cpus);
  }
  for (const [pid, tb] of bodies) {
    if (!seen.has(pid)) { tb.remove(); bodies.delete(pid); expanded.delete(pid); }
  }
  if (!overTable) {
    const order = a.map(x => bodies.get(x.pid));
    const current = [...tbl.querySelectorAll("tbody")];
    if (order.some((tb, i) => tb !== current[i])) order.forEach(tb => tbl.appendChild(tb));
  }
  // refresh unfolded subtrees so child cpu/mem stay live
  for (const pid of expanded) if (seen.has(pid)) loadTree(pid);
}

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
